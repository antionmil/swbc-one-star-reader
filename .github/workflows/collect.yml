name: collect reviews

# Apple throttles its review feed to roughly one page per address per ten
# minutes. A scheduled Action gets a fresh runner, and a fresh address, every
# firing — which is the only reason this site can have a daily feed at all.
# GitHub's shortest schedule is five minutes and it delays runs under load, so
# nothing here assumes a firing happened on time.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx --conditions=react-server scripts/collect.mts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COLLECT_PAIRS: "6"
          COLLECT_GAP_MS: "20000"
