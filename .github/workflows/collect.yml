name: collect reviews

# Apple throttles its review feed to roughly one page per address per ten
# minutes. A scheduled Action gets a fresh runner, and a fresh address, every
# firing — which is the only reason this site can have a daily feed at all.
# GitHub's shortest schedule is five minutes and it delays runs under load, so
# nothing here assumes a firing happened on time.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Four runners, four addresses, four slices of the queue. Apple answered 40
    # of 60 attempts from one runner, so the ceiling was never the throttle —
    # it was that GitHub fired this ten times in a day rather than the
    # forty-eight the schedule asks for. More pages per firing is the lever.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx --conditions=react-server scripts/collect.mts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COLLECT_PAIRS: "14"
          COLLECT_GAP_MS: "9000"
          COLLECT_SHARD: ${{ matrix.shard }}
          COLLECT_SHARDS: "4"
