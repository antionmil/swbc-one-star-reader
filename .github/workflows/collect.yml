name: collect reviews

# Apple throttles its review feed to roughly one page per address per ten
# minutes. A scheduled Action gets a fresh runner, and a fresh address, every
# firing — which is the only reason this site can have a daily feed at all.
# GitHub's shortest schedule is five minutes and it delays runs under load, so
# nothing here assumes a firing happened on time.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Eight runners, eight addresses, eight slices of the queue.
    #
    # The schedule asks for a firing every fifteen minutes and GitHub delivers
    # one every two or three hours — nine scheduled runs in the last twenty-four
    # of them. That is the ceiling on this whole site, not Apple: a fresh runner
    # answered 58 of 62 pages at nine-second gaps, which is nothing like the one
    # page per ten minutes a warm address gets.
    #
    # So the lever is the size of a firing, not its frequency. Even shards widen
    # the watchlist, odd shards refresh what is published; see scripts/collect.mts.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx --conditions=react-server scripts/collect.mts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COLLECT_PAIRS: "30"
          COLLECT_GAP_MS: "9000"
          COLLECT_SHARD: ${{ matrix.shard }}
          COLLECT_SHARDS: "8"
